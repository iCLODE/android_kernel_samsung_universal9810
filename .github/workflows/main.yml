name: Build Kernel using build_kernel.sh

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex gcc-multilib g++-multilib git gnupg gperf libxml2-utils lzop openjdk-11-jdk python3 python3-pip rsync schedtool squashfs-tools zip zlib1g-dev

      - name: Make build script executable
        run: chmod +x build_kernel.sh

      - name: Run the build script
        run: ./build_kernel.sh

      - name: List build output directory
        run: |
          ls -la arch/arm64/boot/ || echo "Not found in arch/arm64/boot/"
          find . -name "Image" -o -name "Image.gz" -o -name "*.img" 2>/dev/null

      - name: Upload whatever found
        uses: actions/upload-artifact@v4
        with:
          name: kernel-outputs
          path: |
            **/Image
            **/Image.gz
            **/Image.gz-dtb
            **/*.img
