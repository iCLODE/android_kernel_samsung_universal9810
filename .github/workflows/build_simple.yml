name: Build Kernel for Crownlte (N960F)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Build Kernel
      uses: johanlike/kernel-build-action@v1
      with:
        kernel-url: ./
        config: crownlte_defconfig
        arch: arm64
        cross-compile: aarch64-linux-gnu-
